<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>B's Gua Sha</title>
<meta name="description" content="B's Gua Sha апп — цаг захиалга, хэтэвч, багц, бэлгийн карт, чат">
<meta name="theme-color" content="#9a7b3c">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/app/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/app.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js" defer onerror="window.__qrFailed=1"></script>
</head>
<body>

<div id="app" class="app-root"></div>

<nav id="tabbar" class="tabbar" hidden>
  <!-- desktop only: the bottom tab bar becomes a left sidebar -->
  <a class="side-brand" href="/"><img src="/assets/logo.svg" alt=""><span>B's Gua Sha</span></a>
  <button data-view="home" class="tab active">
    <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 9.5V21h5v-6h4v6h5V9.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span data-i18n="nav.home">Нүүр</span>
  </button>
  <button data-view="book" class="tab">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span data-i18n="nav.book">Захиалга</span>
  </button>
  <button data-view="wallet" class="tab">
    <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18" stroke="currentColor" stroke-width="1.8"/><circle cx="17" cy="14.5" r="1.3" fill="currentColor"/></svg>
    <span data-i18n="nav.wallet">Хэтэвч</span>
  </button>
  <button data-view="progress" class="tab">
    <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 7l1.5-3h3L15 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13.5" r="3.4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    <span data-i18n="nav.progress">Явц</span>
  </button>
  <button data-view="profile" class="tab">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 21c1.5-4 5-5.5 8-5.5s6.5 1.5 8 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span data-i18n="nav.profile">Профайл</span>
  </button>
  <div class="side-sep side-only"></div>
  <button data-view="chat" class="tab side-only">
    <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    <span data-i18n="nav.chat">Чат</span><b class="side-badge" id="sideChatBadge" hidden></b>
  </button>
  <button data-view="edu" class="tab side-only">
    <svg viewBox="0 0 24 24"><path d="M6 4h12l3 5-9 11L3 9z M3 9h18 M9 4l3 16 3-16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <span data-i18n="nav.edu">Бүтээгдэхүүн</span>
  </button>
  <button data-view="faq" class="tab side-only">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7v.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="17" r="1.1" fill="currentColor"/></svg>
    <span data-i18n="nav.faq">Асуулт</span>
  </button>
  <a class="side-site side-only" href="/" data-i18n="nav.site">Вэбсайт руу буцах</a>
</nav>

<div id="modalHost"></div>
<div id="toastHost"></div>

<script src="/app/i18n.js"></script>
<script src="/assets/imgtools.js"></script>
<script src="/app/censor.js"></script>
<script src="/app/app.js"></script>
</body>
</html>

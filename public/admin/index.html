<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B's Guasha — Admin</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app/app.css">
<style>
  .admin-root { max-width: 860px; margin: 0 auto; padding: 18px 16px 60px; }
  .admin-tabs { display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
  .admin-tabs button {
    border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 999px; padding: 8px 16px; font-weight: 600; cursor: pointer; font-size: 0.9rem;
  }
  .admin-tabs button.active { background: var(--jade); border-color: var(--jade); color: #fff; }
  [data-theme="dark"] .admin-tabs button.active { color: #0e1513; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .stat b { font-size: 1.25rem; display: block; }
  .stat span { color: var(--muted); font-size: 0.78rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 0.78rem; }
  .bk-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .bk-actions button { border: 1px solid var(--line); background: var(--surface2); color: var(--ink); border-radius: 8px; padding: 4px 9px; cursor: pointer; font-size: 0.76rem; font-weight: 600; }
  .bk-actions button:hover { border-color: var(--jade); }
  .price-input { width: 110px; padding: 6px 8px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
  .pin-wrap { max-width: 360px; margin: 14vh auto 0; text-align: center; }
</style>
</head>
<body>
<div class="admin-root" id="root"></div>
<div id="toastHost"></div>
<script src="/admin/admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B's Gua Sha — Удирдлага</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<!-- Add to Home Screen: opens full screen like an app, stays signed in -->
<link rel="manifest" href="/admin/manifest.webmanifest">
<meta name="theme-color" content="#9a7b3c">
<link rel="apple-touch-icon" href="/app/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="B's Ажилтан">
<link rel="stylesheet" href="/app/app.css">
<style>
  .admin-root { max-width: 1060px; margin: 0 auto; padding: 18px 16px 60px; }
  .admin-tabs { display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
  .admin-tabs button {
    border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 999px; padding: 8px 14px; font-weight: 600; cursor: pointer; font-size: 0.88rem;
    position: relative;
  }
  .admin-tabs button.active { background: var(--brand); border-color: var(--brand); color: #fff; }
  [data-theme="dark"] .admin-tabs button.active { color: #1c1610; }
  .admin-tabs .badge { position: absolute; top: -6px; right: -4px; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .stat b { font-size: 1.25rem; display: block; }
  .stat span { color: var(--muted); font-size: 0.78rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 0.78rem; }
  .bk-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .bk-actions button, .mini-btn {
    border: 1px solid var(--line); background: var(--surface2); color: var(--ink);
    border-radius: 8px; padding: 4px 9px; cursor: pointer; font-size: 0.76rem; font-weight: 600;
  }
  .bk-actions button:hover, .mini-btn:hover { border-color: var(--brand); }
  .price-input { width: 100px; padding: 6px 8px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
  .cell-input { padding: 6px 8px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); width: 100%; }
  .pin-wrap { max-width: 380px; margin: 8vh auto 0; text-align: center; }
  .pin-wrap img { width: 84px; height: 84px; border-radius: 18px; }

  /* calendar */
  .cal-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .cal-grid { overflow-x: auto; }
  .cal-grid table { min-width: 560px; }
  .cal-grid th { position: sticky; top: 0; background: var(--bg); }
  .cal-grid td { padding: 3px; border: 1px solid var(--line); height: 52px; min-width: 130px; }
  .cal-grid td.timecol { min-width: 56px; width: 56px; font-weight: 700; color: var(--muted); text-align: center; border-left: none; border-right: none; background: none; }
  .cal-cell { border-radius: 9px; height: 100%; min-height: 46px; padding: 5px 7px; font-size: 0.78rem; cursor: pointer; }
  .cal-cell.empty { background: var(--surface); border: 1.5px dashed var(--line); }
  .cal-cell.empty:hover { border-color: var(--brand); }
  .cal-cell.off { background: repeating-linear-gradient(45deg, var(--surface2), var(--surface2) 6px, transparent 6px, transparent 12px); cursor: default; opacity: 0.6; }
  .cal-cell.busy { color: #fff; font-weight: 600; }
  .cal-cell.blocked { background: var(--surface2); border: 1.5px solid var(--muted); color: var(--muted); font-weight: 600; }
  .cal-cell .sub { display: block; font-weight: 400; font-size: 0.7rem; opacity: 0.9; }
  .staff-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
  .cal-stack { display: flex; flex-direction: column; gap: 3px; min-height: 46px; height: 100%; }
  .cal-item { border-radius: 9px; padding: 5px 7px; font-size: 0.78rem; cursor: pointer; }
  .cal-item.busy { color: #fff; font-weight: 600; }
  .cal-item.cont { opacity: 0.55; }
  .cal-item.blocked { background: var(--surface2); border: 1.5px solid var(--muted); color: var(--muted); font-weight: 600; }
  .cal-item.add { background: var(--surface); border: 1.5px dashed var(--line); color: var(--muted); text-align: center; }
  .cal-item.add:only-child { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 1rem; }
  .cal-item.add:hover { border-color: var(--brand); }
  .cal-item .sub { display: block; font-weight: 400; font-size: 0.7rem; opacity: 0.9; }

  /* setup health */
  .health-card { border-color: #d9a441; background: color-mix(in srgb, #d9a441 12%, var(--surface)); padding: 14px 16px; margin-bottom: 14px; }
  .health-card ul { margin: 8px 0 6px 18px; display: grid; gap: 6px; font-size: 0.88rem; }
  .health-card code { background: var(--surface2); border-radius: 5px; padding: 1px 5px; font-size: 0.82rem; }

  /* fast phone booking */
  .qb-step { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .qb-n { flex: 0 0 26px; height: 26px; border-radius: 50%; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; }
  [data-theme="dark"] .qb-n { color: #1c1610; }
  .qb-body { flex: 1; min-width: 0; }
  .qb-phone { width: 100%; font-size: 1.35rem; letter-spacing: 0.08em; padding: 12px; min-height: 56px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); }
  .qb-phone:focus { border-color: var(--brand); outline: none; }
  .qb-match { display: block; width: 100%; text-align: left; margin-top: 6px; padding: 12px; min-height: 50px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); cursor: pointer; font-size: 0.95rem; }
  .qb-match:hover { border-color: var(--brand); }
  .qb-new { margin-top: 8px; font-size: 0.85rem; color: var(--brand-deep); display: grid; gap: 6px; }
  .qb-client { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; background: var(--brand-soft); border-radius: 10px; padding: 10px 12px; }
  .qb-svcs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .qb-svc, .qb-chip, .qb-slot { border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
  .qb-svc { text-align: left; padding: 10px 12px; min-height: 64px; }
  .qb-svc small { display: block; color: var(--muted); font-weight: 500; font-size: 0.74rem; }
  .qb-days { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; }
  .qb-chip { flex: 0 0 auto; padding: 10px 14px; min-height: 44px; }
  .qb-chip[disabled] { opacity: 0.4; cursor: not-allowed; }
  .qb-slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .qb-slot { padding: 0; min-height: 48px; font-size: 1rem; }
  .qb-slot[disabled] { opacity: 0.3; text-decoration: line-through; cursor: not-allowed; }
  .qb-slot.was[disabled] { opacity: 1; text-decoration: none; border-style: dashed; color: var(--muted); }
  .qb-svc.on, .qb-chip.on, .qb-slot.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .qb-svc.on small { color: rgba(255,255,255,0.85); }
  [data-theme="dark"] .qb-svc.on, [data-theme="dark"] .qb-chip.on, [data-theme="dark"] .qb-slot.on { color: #1c1610; }
  .qb-more { margin-top: 10px; font-size: 0.88rem; }
  .qb-more summary { cursor: pointer; color: var(--brand); font-weight: 600; margin-bottom: 6px; }
  .linklike { background: none; border: none; color: var(--brand); font-weight: 600; cursor: pointer; font-size: 0.85rem; margin-top: 8px; padding: 0; }
  .qb-link { background: none; border: none; color: var(--brand); font-weight: 600; cursor: pointer; font-size: 0.95rem; padding: 10px 4px; min-height: 44px; flex: 0 0 auto; }
  .qb-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; position: relative; scrollbar-width: none; }
  .qb-row::-webkit-scrollbar { display: none; }
  .qb-row.wrap { flex-wrap: wrap; overflow: visible; }
  .qb-hour { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
  .qb-h { flex: 0 0 22px; padding-top: 14px; color: var(--muted); font-weight: 700; font-size: 0.82rem; }
  .qb-hour .qb-slots { flex: 1; }
  .qb-warn { background: var(--surface2); border-radius: 12px; padding: 12px; font-size: 0.92rem; }
  .qb-svc-name { display: block; }
  .qb-svc small.qb-mach { color: var(--brand-deep); }
  .qb-svc.on small.qb-mach { color: rgba(255,255,255,0.9); }

  /* phone-first sheets (booking, blocking time): full screen on a phone, a dialog on a computer */
  .sheet-back { align-items: stretch; }
  .sheet { background: var(--bg); width: 100%; max-width: 720px; height: 100%; display: flex; flex-direction: column; animation: slideUp 0.2s ease; }
  @media (min-width: 760px) {
    .sheet-back { align-items: center; padding: 24px; }
    .sheet { height: auto; max-height: calc(100vh - 48px); border-radius: 22px; overflow: hidden; }
  }
  .sheet-inner { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px 10px 16px; padding-top: calc(10px + env(safe-area-inset-top)); border-bottom: 1px solid var(--line); font-size: 1.05rem; }
  .sheet-x { flex: 0 0 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-size: 1.05rem; cursor: pointer; }
  .sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 16px 16px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  .sheet-foot { padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--bg); }
  .big-btn { min-height: 54px; font-size: 1.02rem; }
  .big-input { font-size: 1rem; padding: 12px; min-height: 48px; margin-top: 6px; }
  .bs-h { font-size: 0.9rem; margin: 14px 0 8px; color: var(--muted); }

  /* my day */
  .day-nav { display: flex; align-items: stretch; gap: 8px; margin-bottom: 6px; }
  .day-arrow { flex: 0 0 54px; min-height: 54px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-size: 1.7rem; line-height: 1; cursor: pointer; }
  .day-title { flex: 1; min-width: 0; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px; }
  .day-title b { font-size: 1.1rem; }
  .day-title small { color: var(--muted); font-size: 0.78rem; }
  .day-meta { margin: 8px 2px 12px; font-size: 0.9rem; }
  .big-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .big-actions .btn { padding: 12px 10px; }
  .day-list { display: grid; gap: 8px; }
  .day-item { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-height: 66px; cursor: pointer; }
  .day-item.is-block { background: var(--surface2); cursor: default; }
  .day-item.is-dim { opacity: 0.55; }
  .di-time { flex: 0 0 52px; font-weight: 800; font-size: 1.05rem; display: flex; flex-direction: column; }
  .di-time small { font-weight: 500; color: var(--muted); font-size: 0.8rem; }
  .di-body { flex: 1; min-width: 0; }
  .di-call { display: inline-block; font-size: 0.88rem; padding: 4px 2px; }
  .di-mach { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; font-size: 0.8rem; color: var(--brand-deep); }
  .di-act { min-height: 44px; padding: 6px 14px !important; }
  .empty-day { text-align: center; color: var(--muted); padding: 30px 10px; background: var(--surface); border: 1.5px dashed var(--line); border-radius: 14px; }

  /* machine board */
  .mboard { padding: 14px; }
  .mb-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .mb-head .muted { margin-left: auto; }
  .mtrack { position: relative; height: 34px; background: var(--surface2); border-radius: 8px; margin: 24px 0 10px; }
  .mtrack i { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
  .mtrack i span { position: absolute; top: -18px; left: -7px; font-size: 0.68rem; color: var(--muted); font-style: normal; }
  .mtrack .seg { position: absolute; top: 5px; bottom: 5px; background: #d9a441; border-radius: 5px; }
  .mtrack .seg.full { background: var(--danger); }
  .mlist { list-style: none; display: grid; gap: 4px; font-size: 0.9rem; margin: 0 0 6px; padding: 0; }

  /* booking dialog + machine editor */
  .bm-mach { background: var(--brand-soft); border-radius: 10px; padding: 8px 10px; display: grid; gap: 2px; margin-bottom: 8px; }
  .bm-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
  .bm-actions .btn { min-height: 48px; padding: 10px; }
  .mu-row { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 10px; }
  .mu-row .row { gap: 8px; align-items: flex-end; }
  .mu-row label { display: grid; gap: 4px; flex: 1; }
  .table-scroll { overflow-x: auto; }

  /* chat admin */
  .chat-cols { display: grid; grid-template-columns: 280px 1fr; gap: 14px; }
  @media (max-width: 720px) { .chat-cols { grid-template-columns: 1fr; } }
  .thread { display: flex; gap: 8px; padding: 10px 8px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 8px; align-items: center; }
  .thread:hover, .thread.active { background: var(--surface2); }
  .thread .tn { font-weight: 600; font-size: 0.88rem; }
  .thread .tl { color: var(--muted); font-size: 0.76rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 170px; }
  .thread .badge { position: static; margin-left: auto; }
  .conv { display: flex; flex-direction: column; gap: 8px; max-height: 480px; overflow-y: auto; padding: 8px 2px; }

  .star-lg { color: var(--gold); letter-spacing: 2px; }
  .hours-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; font-size: 0.85rem; }
  .hours-row .wd { width: 36px; font-weight: 700; color: var(--muted); }
  .hours-row input[type="time"] { padding: 4px 6px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
  .chipline { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .datechip { background: var(--surface2); border-radius: 999px; padding: 3px 10px; font-size: 0.78rem; font-weight: 600; }
  .datechip b { cursor: pointer; color: var(--danger); margin-left: 4px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 0.85rem; }
  .bar-row .bar { flex: 1; height: 10px; background: var(--surface2); border-radius: 999px; overflow: hidden; }
  .bar-row .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--brand)); }

  /* lists as cards: they fit a phone, and a tap opens the item */
  .nw { white-space: nowrap; }
  .list-h { font-size: 1.05rem; margin: 18px 0 8px; }
  .list-day { margin: 14px 2px 6px; }
  .cust-tools { display: grid; grid-template-columns: 1fr auto; gap: 8px 10px; align-items: center; margin-bottom: 12px; }
  .cust-tools .big-check { grid-column: 1 / -1; }
  .cust-list { display: grid; gap: 8px; }
  @media (min-width: 900px) { .cust-list { grid-template-columns: 1fr 1fr; } }
  .cust-card { display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px 12px 14px; cursor: pointer; }
  .cust-card:hover { border-color: var(--brand); }
  .cc-main { flex: 1; min-width: 0; display: grid; gap: 3px; }
  .cc-desc { color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
  .cc-call { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; min-height: 52px; justify-content: center; border-radius: 12px; background: var(--brand-soft); text-decoration: none; font-size: 1.2rem; }
  .cc-call span { font-size: 0.68rem; color: var(--muted); }
  .big-check { display: flex; gap: 8px; align-items: center; cursor: pointer; min-height: 44px; }
  .big-check input { width: 22px; height: 22px; flex: 0 0 auto; }
  .qb-cnt { display: block; font-size: 0.68rem; font-weight: 500; opacity: 0.75; }
  .qb-chip.zero:not(.on) { opacity: 0.55; }
  .qb-chosen { display: block; padding: 4px 0 8px; text-align: left; min-height: 0; }
  .note-input { width: 100%; margin-top: 4px; }
  .qb-mnote { background: var(--surface2); border-radius: 10px; padding: 8px 10px; font-size: 0.85rem; margin: 0 0 10px; line-height: 1.5; }
  .qb-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mtrack .seg.mine { top: auto; bottom: 0; height: 4px; background: var(--brand); border-radius: 2px; }
  /* dialogs never wider than the phone; wide tables scroll inside them */
  .modal { max-width: min(640px, 100vw); box-sizing: border-box; overflow-x: hidden; }
  .modal table { display: block; overflow-x: auto; }
  .modal .row { flex-wrap: wrap; min-width: 0; }

  .fab { display: none; }
  @media (max-width: 720px) {
    .admin-root { padding: 12px 12px calc(100px + env(safe-area-inset-bottom)); }
    .admin-head { gap: 8px !important; }
    .admin-head h2 { font-size: 1.15rem; }
    .hide-phone { display: none; }
    #quickBtn { display: none; }
    .admin-tabs { flex-wrap: nowrap; overflow-x: auto; margin: 12px -12px; padding: 0 12px 4px; scrollbar-width: none; }
    .admin-tabs::-webkit-scrollbar { display: none; }
    .admin-tabs button { flex: 0 0 auto; padding: 10px 14px; min-height: 44px; }
    .bk-actions button, .mini-btn { min-height: 40px; padding: 8px 12px; font-size: 0.85rem; }
    #outBtn, #themeBtn, #calFeedBtn { min-height: 44px; min-width: 44px; }
    .modal .row input.cell-input { min-width: 0 !important; flex: 1 1 160px; }
    .fab {
      display: flex; align-items: center; justify-content: center; position: fixed; z-index: 50;
      right: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); width: 64px; height: 64px; border-radius: 50%;
      border: none; font-size: 1.6rem; cursor: pointer; color: #fff;
      background: linear-gradient(135deg, var(--gold), var(--brand)); box-shadow: 0 8px 22px rgba(60, 40, 10, 0.35);
    }
  }
</style>
</head>
<body>
<div class="admin-root" id="root"></div>
<div id="toastHost"></div>
<div id="modalHost"></div>
<script src="/assets/imgtools.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>

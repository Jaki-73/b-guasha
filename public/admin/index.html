<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B's Gua Sha — Удирдлага</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app/app.css">
<style>
  .admin-root { max-width: 1060px; margin: 0 auto; padding: 18px 16px 60px; }
  .admin-tabs { display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
  .admin-tabs button {
    border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 999px; padding: 8px 14px; font-weight: 600; cursor: pointer; font-size: 0.88rem;
    position: relative;
  }
  .admin-tabs button.active { background: var(--brand); border-color: var(--brand); color: #fff; }
  [data-theme="dark"] .admin-tabs button.active { color: #1c1610; }
  .admin-tabs .badge { position: absolute; top: -6px; right: -4px; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .stat b { font-size: 1.25rem; display: block; }
  .stat span { color: var(--muted); font-size: 0.78rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 0.78rem; }
  .bk-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .bk-actions button, .mini-btn {
    border: 1px solid var(--line); background: var(--surface2); color: var(--ink);
    border-radius: 8px; padding: 4px 9px; cursor: pointer; font-size: 0.76rem; font-weight: 600;
  }
  .bk-actions button:hover, .mini-btn:hover { border-color: var(--brand); }
  .price-input { width: 100px; padding: 6px 8px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
  .cell-input { padding: 6px 8px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); width: 100%; }
  .pin-wrap { max-width: 380px; margin: 8vh auto 0; text-align: center; }
  .pin-wrap img { width: 84px; height: 84px; border-radius: 18px; }

  /* calendar */
  .cal-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .cal-grid { overflow-x: auto; }
  .cal-grid table { min-width: 560px; }
  .cal-grid th { position: sticky; top: 0; background: var(--bg); }
  .cal-grid td { padding: 3px; border: 1px solid var(--line); height: 52px; min-width: 130px; }
  .cal-grid td.timecol { min-width: 56px; width: 56px; font-weight: 700; color: var(--muted); text-align: center; border-left: none; border-right: none; background: none; }
  .cal-cell { border-radius: 9px; height: 100%; min-height: 46px; padding: 5px 7px; font-size: 0.78rem; cursor: pointer; }
  .cal-cell.empty { background: var(--surface); border: 1.5px dashed var(--line); }
  .cal-cell.empty:hover { border-color: var(--brand); }
  .cal-cell.off { background: repeating-linear-gradient(45deg, var(--surface2), var(--surface2) 6px, transparent 6px, transparent 12px); cursor: default; opacity: 0.6; }
  .cal-cell.busy { color: #fff; font-weight: 600; }
  .cal-cell.blocked { background: var(--surface2); border: 1.5px solid var(--muted); color: var(--muted); font-weight: 600; }
  .cal-cell .sub { display: block; font-weight: 400; font-size: 0.7rem; opacity: 0.9; }
  .staff-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }

  /* chat admin */
  .chat-cols { display: grid; grid-template-columns: 280px 1fr; gap: 14px; }
  @media (max-width: 720px) { .chat-cols { grid-template-columns: 1fr; } }
  .thread { display: flex; gap: 8px; padding: 10px 8px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 8px; align-items: center; }
  .thread:hover, .thread.active { background: var(--surface2); }
  .thread .tn { font-weight: 600; font-size: 0.88rem; }
  .thread .tl { color: var(--muted); font-size: 0.76rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 170px; }
  .thread .badge { position: static; margin-left: auto; }
  .conv { display: flex; flex-direction: column; gap: 8px; max-height: 480px; overflow-y: auto; padding: 8px 2px; }

  .star-lg { color: var(--gold); letter-spacing: 2px; }
  .hours-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; font-size: 0.85rem; }
  .hours-row .wd { width: 36px; font-weight: 700; color: var(--muted); }
  .hours-row input[type="time"] { padding: 4px 6px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
  .chipline { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .datechip { background: var(--surface2); border-radius: 999px; padding: 3px 10px; font-size: 0.78rem; font-weight: 600; }
  .datechip b { cursor: pointer; color: var(--danger); margin-left: 4px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 0.85rem; }
  .bar-row .bar { flex: 1; height: 10px; background: var(--surface2); border-radius: 999px; overflow: hidden; }
  .bar-row .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--brand)); }
</style>
</head>
<body>
<div class="admin-root" id="root"></div>
<div id="toastHost"></div>
<div id="modalHost"></div>
<script src="/assets/imgtools.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
